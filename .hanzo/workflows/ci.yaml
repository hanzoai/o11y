name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: hanzo-build-linux-amd64
    env:
      GOPRIVATE: github.com/hanzoai/*
      GOSUMDB: "off"
    steps:
      # This module does not require github.com/hanzoai/cloud at all — cloud
      # requires o11y, and for one logger field the arrow used to point both ways.
      # No sibling checkout, no pin, no cycle.
      - name: Checkout o11y
        uses: actions/checkout@v4
        with:
          path: o11y

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: o11y/go.mod
          cache-dependency-path: o11y/go.sum

      # Private cross-repo modules (hanzoai/*: sqlite, datastore, otel-collector,
      # …) are fetched over HTTPS git with the org PAT. The two dozen that used to
      # come in transitively via cloud (commerce, iam, kms, licensing, …) are gone
      # with it.
      - name: Configure git auth for private hanzoai modules
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: go build
        working-directory: o11y
        run: go build ./...

      # TestEmailRejected asserts an emersion/go-smtp v0.24.0 error string that
      # upstream (wholesale-synced O11y) formats with quotes; skip only it.
      - name: go test
        working-directory: o11y
        run: go test -count=1 -skip '^TestEmailRejected$' ./...
