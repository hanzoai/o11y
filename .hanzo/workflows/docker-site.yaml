name: docker-site

# Builds the o11y browser SPA image (ghcr.io/hanzoai/o11y-site) served by
# hanzoai/static at the edge. The main `docker.yaml` builds the HEADLESS server
# (ghcr.io/hanzoai/o11y, /api only); this builds the dashboard SPA that fronts it.
# See Dockerfile.site.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile.site"
      - "frontend/**"
      - ".hanzo/workflows/docker-site.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: build & push o11y-site image
    runs-on: hanzo-build-linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io wants a GitHub credential, and this job runs on a hanzo
      # self-hosted pool -- so `secrets.GITHUB_TOKEN` is git.hanzo.ai's token,
      # which ghcr.io has never seen (`denied: denied`). orgs/hanzoai provisions
      # GHCR_USER + GHCR_TOKEN; naming them directly rather than through a `||`
      # chain, because a missing org secret is "" and the fallback then swaps
      # credentials without saying so.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hanzoai/o11y-site
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.site
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # Registry cache, not type=gha. The gha backend needs an Actions runtime
          # token, and git.hanzo.ai does not issue one that buildx can parse:
          #   Cannot parse GitHub Actions Runtime Token: missing part #2
          #   failed to configure gha cache exporter: token is malformed
          # That fails the BUILD, so a cache meant to save time was costing the
          # whole job. ignore-error keeps the first build (no cache image yet)
          # from failing on a 404, which is how luxfi/dex was breaking.
          cache-from: type=registry,ref=ghcr.io/hanzoai/o11y-site:buildcache,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/hanzoai/o11y-site:buildcache,mode=max,ignore-error=true