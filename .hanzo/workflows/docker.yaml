name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: build & push image
    runs-on: hanzo-build-linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # NOTE: nothing here needs a hanzoai/cloud sibling, and neither does the
        # go-build job any more — the module does not name cloud at all. What the
        # image DOES now carry is the module's own route table: ./cmd/community's
        # graph reaches github.com/hanzoai/o11y, so the OpenAPI document and the
        # MCP tools ship in the process instead of in a package nothing links.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io wants a GitHub credential, and this job runs on a hanzo
      # self-hosted pool -- so `secrets.GITHUB_TOKEN` is git.hanzo.ai's token,
      # which ghcr.io has never seen (`denied: denied`). orgs/hanzoai provisions
      # GHCR_USER + GHCR_TOKEN; naming them directly rather than through a `||`
      # chain, because a missing org secret is "" and the fallback then swaps
      # credentials without saying so.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hanzoai/o11y
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build timestamp
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # cmd/community pulls PRIVATE hanzoai forks (sqlite, datastore-go); the
          # Dockerfile mounts this as secret id `gh_token` and configs
          # url.insteadOf before `go build`. Without it the build 128s on
          # `git ls-remote https://github.com/hanzoai/sqlite` (auth required).
          secrets: |
            gh_token=${{ secrets.GH_PAT }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_HASH=${{ github.sha }}
            BUILD_TIME=${{ steps.date.outputs.value }}
            BRANCH=${{ github.ref_name }}
            VARIANT=community
          # Registry cache, not type=gha. The gha backend needs an Actions runtime
          # token, and git.hanzo.ai does not issue one that buildx can parse:
          #   Cannot parse GitHub Actions Runtime Token: missing part #2
          #   failed to configure gha cache exporter: token is malformed
          # That fails the BUILD, so a cache meant to save time was costing the
          # whole job. ignore-error keeps the first build (no cache image yet)
          # from failing on a 404, which is how luxfi/dex was breaking.
          cache-from: type=registry,ref=ghcr.io/hanzoai/o11y:buildcache,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/hanzoai/o11y:buildcache,mode=max,ignore-error=true